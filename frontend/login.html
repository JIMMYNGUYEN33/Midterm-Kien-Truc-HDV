<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>iBanking - Đăng nhập</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="page-container">
        <div class="banking-card">
            <h2>TDTU iBanking</h2>
            <div id="login-error" class="alert alert-error"></div>
            
            <form onsubmit="handleLogin(event)">
                <div class="form-group">
                    <label>Tên đăng nhập</label>
                    <input type="text" id="username" class="form-control" placeholder="Nhập tài khoản" required>
                </div>
                <div class="form-group">
                    <label>Mật khẩu</label>
                    <input type="password" id="password" class="form-control" placeholder="••••••••" required>
                </div>
                <button type="submit" class="btn-primary">Đăng nhập</button>
            </form>
        </div>
    </div>

    <script>
        async function handleLogin(event) {
            event.preventDefault();
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;
            const errorDiv = document.getElementById('login-error');

            try {
                const res = await fetch('http://localhost:3000/api/v1/auth/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, password })
                });

                if (res.status === 401) {
                    errorDiv.innerText = "Sai Username hoặc Password!";
                    errorDiv.style.display = "block";
                    return;
                }

                const data = await res.json();
                // Lưu session theo ERD NguoiDung[cite: 3]
                sessionStorage.setItem('token', data.token);
                sessionStorage.setItem('MaNguoiDung', data.MaNguoiDung);
                sessionStorage.setItem('HoTenNguoiNop', data.HoTen);

                window.location.href = 'tuition.html';
            } catch (err) {
                errorDiv.innerText = "Lỗi kết nối máy chủ!";
                errorDiv.style.display = "block";
            }
        }
    </script>
</body>
</html>
