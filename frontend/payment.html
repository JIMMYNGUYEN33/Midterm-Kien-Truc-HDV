<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Xác nhận thanh toán</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <nav class="navbar">
        <div class="brand">TDTU iBanking</div>
        <div class="user-info"><a href="tuition.html">🔙 Quay lại tra cứu</a></div>
    </nav>

    <div class="page-container">
        <div class="banking-card">
            <h2>Xác Nhận Thanh Toán</h2>
            <div id="msg-box" class="alert"></div>

            <div id="init-section">
                <div class="detail-row">
                    <span class="label">MSSV:</span>
                    <span class="value" id="display-mssv"></span>
                </div>
                <div class="detail-row">
                    <span class="label">Số tiền:</span>
                    <span class="value" style="font-size: 20px;"><span id="display-amount"></span> VNĐ</span>
                </div>
                <button onclick="initPayment()" class="btn-primary">Nhận mã xác thực OTP</button>
            </div>

            <div id="otp-section" style="display: none;">
                <div class="form-group" style="text-align: center; margin-top: 10px;">
                    <label style="color: var(--success-green); font-size: 15px; margin-bottom: 15px;">
                        ✓ Mã OTP đã được gửi về Email. Hiệu lực trong 5 phút.
                    </label>
                    <input type="text" id="otpCode" class="form-control" placeholder="Nhập 6 số OTP" style="text-align: center; font-size: 20px; letter-spacing: 5px;">
                </div>
                <button onclick="confirmPayment()" class="btn-primary">Xác nhận thanh toán</button>
            </div>
        </div>
    </div>

    <script>
        document.getElementById('display-mssv').innerText = sessionStorage.getItem('pay_MSSV');
        document.getElementById('display-amount').innerText = Number(sessionStorage.getItem('pay_Amount')).toLocaleString('vi-VN');

        function showMsg(text, isError) {
            const msgBox = document.getElementById('msg-box');
            msgBox.innerText = text;
            msgBox.className = isError ? 'alert alert-error' : 'alert alert-success';
            msgBox.style.display = 'block';
        }

        async function initPayment() {
            const MaNguoiDung = sessionStorage.getItem('MaNguoiDung');
            const MaHocPhi = sessionStorage.getItem('pay_MaHocPhi');

            try {
                const res = await fetch('http://localhost:3000/api/v1/payments/init', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ MaNguoiDung, MaHocPhi })
                });
                const data = await res.json();
                if (!res.ok) return showMsg(data.error, true);

                sessionStorage.setItem('current_MaGiaoDich', data.MaGiaoDich);
                document.getElementById('init-section').style.display = 'none';
                document.getElementById('otp-section').style.display = 'block';
                showMsg(data.message, false);
            } catch (err) {
                showMsg("Lỗi kết nối máy chủ!", true);
            }
        }

        async function confirmPayment() {
            const MaGiaoDich = sessionStorage.getItem('current_MaGiaoDich');
            const MaCode = document.getElementById('otpCode').value;

            try {
                const res = await fetch('http://localhost:3000/api/v1/payments/confirm', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ MaGiaoDich, MaCode })
                });
                const data = await res.json();
                if (!res.ok) return showMsg(data.error, true);

                document.getElementById('otp-section').style.display = 'none';
                showMsg(data.message, false);
                sessionStorage.removeItem('current_MaGiaoDich');
            } catch (err) {
                showMsg("Lỗi kết nối máy chủ!", true);
            }
        }
    </script>
</body>
</html>
